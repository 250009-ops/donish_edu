# Marketing site — donish.live (static files)
server {
    listen 80;
    server_name donish.live www.donish.live;
    root /var/www/donish_live;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|png|jpg|webp|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# API — api.donish.live (unchanged)
server {
    listen 80;
    server_name api.donish.live;
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
