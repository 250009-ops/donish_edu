name: donish_app
description: Gotcha English->Uzbek learning app built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  http_parser: ^4.0.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  file_picker: ^8.0.0
  url_launcher: ^6.2.5
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

